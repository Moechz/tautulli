# ===========================================================================
# Tautulli for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : linuxserver/tautulli:v2.19.1-ls252 (Docker Hub, used unmodified)
#                  -> https://github.com/linuxserver/docker-tautulli
#
# Ports   : host 8015 -> container 8181. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/tautullidocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the upstream image generates a random admin password on first start
#           and only prints it in /config/logs/tautulli.log; this wrapper seeds a
#           known initial admin account (admin / tautulli) into /config/config.ini
#           before exec'ing the upstream /init. Later starts keep the user config.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  tautullidocker:
    image: linuxserver/tautulli:v2.19.1-ls252
    container_name: tautullidocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # ===========================================================================
        # Tautulli for TOS 7 - first-run wrapper
        #
        # Tautulli 2.19 generates a random admin password on a fresh install and only
        # prints it in /config/logs/tautulli.log, which is not reachable from the TOS
        # App Center. This wrapper seeds a known initial admin account (admin /
        # tautulli) into /config/config.ini before the upstream s6 init starts, so the
        # login page is usable on first visit. The user is expected to change the
        # password immediately; on later starts the existing config is left untouched.
        #
        # The upstream /init is still executed as PID 1, so the image's own s6
        # supervision, migrations and health behaviour are unchanged.
        # ===========================================================================
        set -u

        CONF=/config/config.ini
        export HOME=/config
        export PATH=/lsiopy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

        mkdir -p /config

        if [ ! -f "$$CONF" ]; then
          echo "tautulli: first start - seeding the initial admin account (admin / tautulli)"
          umask 077
          cat > "$$CONF" <<'CFG'
        [General]
        http_username = admin
        http_password = PBKDF2$$sha256$$600000$$jpggqbUVkm9ELAqHiKqN1Q==$$S3fhd0YyqjqTIqV2OerSSmryromxooL+
        http_hash_password = 1
        http_hashed_password = 1
        CFG
          chmod 600 "$$CONF"
          umask 022
        fi

        exec /init
    ports:
      - "8015:8181"
    environment:
      TZ: "Asia/Shanghai"
      HOME: "/config"
    volumes:
      - /Volume1/DockerAppData/tautullidocker/config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8181/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8015
    protocol: http
